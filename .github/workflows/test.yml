name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    defaults:
      run:
        shell: bash
    env:
      TAIWAN_LAB_DATA_MODE: sample
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,cdc-manual]'
      - name: Lint
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
      - name: Test source and MCP stdio
        run: python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify built archives
        env:
          TAIWAN_LAB_ARTIFACT_DIR: ${{ github.workspace }}/dist
        run: python -m pytest tests/test_package_contents.py -q
      - name: Verify installed wheel outside repository
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests" -q
          python -m taiwan_lab_mcp.demo
