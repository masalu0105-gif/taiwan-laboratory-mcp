name: Release to PyPI

# Two ways in:
#   - push a v* tag (the normal path from here on)
#   - run it by hand from the Actions tab (used for 0.1.2, whose tag predates this file)
# Publishing uses PyPI Trusted Publishing (OIDC), so no API token is stored in this repo.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # required by Trusted Publishing
    defaults:
      run:
        shell: bash
    env:
      TAIWAN_LAB_DATA_MODE: sample
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev,cdc-manual]'

      - name: Refuse a tag that disagrees with pyproject
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "$tag" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $ver" >&2
            exit 1
          fi
          echo "tag and version agree: $ver"

      - name: Test source and MCP stdio
        run: python -m pytest -q

      - name: Build sdist and wheel
        run: python -m build

      # Same order as CI: build first, then point the package test at that build.
      # A skipped package test is not an archive check (see docs/next-steps.md).
      - name: Verify built archives
        env:
          TAIWAN_LAB_ARTIFACT_DIR: ${{ github.workspace }}/dist
        run: python -m pytest tests/test_package_contents.py -q

      - name: Verify installed wheel outside repository
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests" -q
          python -m taiwan_lab_mcp.demo

      - uses: pypa/gh-action-pypi-publish@release/v1
